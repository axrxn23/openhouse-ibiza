<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Oficial 30 Puertas — Open House Ibiza 2027</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

        :root {
            --gold: #e5c358;
            --gold-dark: #b89628;
            --dark: #141414;
            --gray-bg: #f3f3f0;
            --border: #e2e2dd;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--gray-bg);
            color: var(--dark);
            margin: 0;
            padding: 95px 20px 40px 20px;
        }

        /* BARRA DE CONTROL SUPERIOR */
        .topbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            background: var(--dark);
            color: #fff;
            padding: 12px 24px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            z-index: 9999;
            box-shadow: 0 4px 15px rgba(0,0,0,0.25);
        }
        .topbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .brand-badge {
            background: var(--gold);
            color: #000;
            font-weight: 900;
            padding: 6px 10px;
            font-size: 13px;
            letter-spacing: 0.5px;
            border-radius: 3px;
        }
        .topbar select, .topbar input {
            background: #262626;
            color: #fff;
            border: 1px solid var(--gold);
            padding: 8px 12px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 4px;
        }
        .topbar input { width: 250px; }
        .topbar-btns {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn-top {
            background: #2b2b2b;
            color: #fff;
            border: 1px solid #444;
            padding: 8px 13px;
            font-size: 12px;
            font-weight: 700;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-top:hover { background: #3c3c3c; }
        .btn-top.gold {
            background: var(--gold);
            color: #000;
            border-color: var(--gold);
        }

        /* BANNER MODO QR INDIVIDUAL */
        .modo-qr-banner {
            max-width: 920px;
            margin: 0 auto 15px auto;
            background: #141414;
            color: #fff;
            padding: 12px 20px;
            border-radius: 6px;
            display: none;
            justify-content: space-between;
            align-items: center;
            border-left: 5px solid var(--gold);
            font-size: 13px;
        }
        .modo-qr-banner button {
            background: var(--gold);
            color: #000;
            border: none;
            padding: 6px 12px;
            font-weight: 800;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        /* FICHA INDIVIDUAL */
        .ficha-page {
            max-width: 920px;
            margin: 0 auto 50px auto;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.07);
            border: 1px solid var(--border);
            page-break-after: always;
            break-after: page;
        }

        .ficha-header {
            background: var(--dark);
            color: #fff;
            padding: 22px 28px;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 20px;
            align-items: center;
            border-bottom: 4px solid var(--gold);
        }
        .pilar-tag {
            display: inline-block;
            background: var(--gold);
            color: #000;
            font-size: 10px;
            font-weight: 900;
            text-transform: uppercase;
            padding: 4px 9px;
            letter-spacing: 1px;
            border-radius: 2px;
            margin-bottom: 8px;
        }
        .ficha-title {
            font-size: 25px;
            font-weight: 900;
            margin: 0 0 8px 0;
            letter-spacing: -0.5px;
            line-height: 1.15;
        }
        .id-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            font-size: 12px;
            color: #ccc;
        }
        .id-meta span strong { color: var(--gold); }

        .qr-box {
            background: #fff;
            color: #000;
            padding: 8px;
            border-radius: 6px;
            text-align: center;
            width: 104px;
            text-decoration: none;
            display: block;
        }
        .qr-box img {
            width: 84px;
            height: 84px;
            display: block;
            margin: 0 auto;
        }
        .qr-box span {
            display: block;
            font-size: 8.5px;
            font-weight: 800;
            text-transform: uppercase;
            margin-top: 4px;
            color: #111;
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 50% 50%;
            border-bottom: 1px solid var(--border);
        }
        .foto-container {
            position: relative;
            background: #222;
            min-height: 275px;
            overflow: hidden;
        }
        .foto-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .btn-upload {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: rgba(0,0,0,0.82);
            color: #fff;
            border: 1px solid var(--gold);
            padding: 7px 12px;
            font-size: 11px;
            font-weight: 700;
            border-radius: 4px;
            cursor: pointer;
        }

        .autoria-panel {
            padding: 20px 24px;
            background: #fafaf8;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .block-label {
            font-size: 10px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--gold-dark);
            margin-bottom: 8px;
        }
        .data-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 12px;
        }
        .data-item {
            background: #fff;
            padding: 9px 11px;
            border: 1px solid var(--border);
            border-radius: 4px;
        }
        .data-item.full { grid-column: span 2; }
        .data-item small {
            display: block;
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            color: #777;
            margin-bottom: 2px;
        }
        .data-item div { font-weight: 600; color: #111; }

        .nivel-divulgativo {
            padding: 22px 28px;
            border-bottom: 1px solid var(--border);
        }
        .nivel-badge {
            display: inline-block;
            background: #eef6ec;
            color: #1f5e24;
            border: 1px solid #b7dfb9;
            font-size: 10px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 3px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        .divulgativa-box {
            background: #fdfcf7;
            border-left: 4px solid var(--gold);
            padding: 14px 18px;
            font-size: 13.5px;
            line-height: 1.6;
            color: #222;
            margin-bottom: 18px;
        }
        .divulgativa-box p { margin: 0 0 8px 0; }
        .divulgativa-box p:last-child { margin-bottom: 0; }

        .logistica-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .log-card {
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 11px 14px;
            background: #fff;
            font-size: 12px;
            line-height: 1.48;
        }
        .log-card h4 {
            margin: 0 0 5px 0;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            color: #111;
            border-bottom: 2px solid var(--gold);
            padding-bottom: 3px;
            display: inline-block;
        }

        .nivel-tecnico {
            background: #f7f7f4;
            border-bottom: 1px solid var(--border);
        }
        .nivel-tecnico summary {
            padding: 14px 28px;
            font-size: 12.5px;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            background: #eaeae4;
            color: #111;
            display: flex;
            justify-content: space-between;
            align-items: center;
            list-style: none;
        }
        .summary-tag {
            background: var(--dark);
            color: var(--gold);
            font-size: 10px;
            padding: 4px 8px;
            border-radius: 3px;
        }
        .tecnico-body {
            padding: 20px 28px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            font-size: 12px;
        }
        .tec-box {
            background: #fff;
            border: 1px solid #dcdcd4;
            padding: 10px 13px;
            border-radius: 4px;
        }
        .tec-box.full { grid-column: span 2; }
        .tec-box strong {
            display: block;
            font-size: 9.5px;
            text-transform: uppercase;
            color: #666;
            margin-bottom: 3px;
        }

        .ficha-footer {
            padding: 13px 28px;
            background: #fff;
            font-size: 11px;
            color: #555;
        }
        .relacionado-bar {
            padding-bottom: 7px;
            margin-bottom: 6px;
            border-bottom: 1px dashed var(--border);
            color: #222;
        }
        .prod-control {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            font-size: 10px;
            color: #666;
        }

        [contenteditable="true"]:hover { outline: 1px dashed var(--gold-dark); }
        [contenteditable="true"]:focus { outline: 2px solid var(--gold); background: #fffef5; color: #000; }

        @media (max-width: 760px) {
            body { padding: 80px 10px 20px 10px; }
            .hero-grid, .logistica-grid, .tecnico-body { grid-template-columns: 1fr; }
            .tec-box.full, .data-item.full { grid-column: span 1; }
            .ficha-header { grid-template-columns: 1fr; }
        }

        @media print {
            body { background: #fff; padding: 0; }
            .topbar, .btn-upload, .modo-qr-banner { display: none !important; }
            .ficha-page {
                box-shadow: none;
                border: 1px solid #ccc;
                margin: 0 0 20px 0;
                max-width: 100%;
                page-break-after: always;
            }
        }
    </style>
</head>

        function obtenerBaseUrl() {
            const custom = document.getElementById('customBaseUrl').value.trim();
            if (custom) return custom.split('?')[0];
            if (window.location.protocol.startsWith('http')) {
                return window.location.origin + window.location.pathname;
            }
            return "https://openhouse-ibiza-2027.tiiny.site/";
        }

        function renderCatalogo() {
            const container = document.getElementById('catalogoContainer');
            const selector = document.getElementById('selectorFicha');
            container.innerHTML = '';

            const baseUrl = obtenerBaseUrl();

            espacios30.forEach((e) => {
                const opt = document.createElement('option');
                opt.value = e.num;
                opt.textContent = `Puerta #${e.num} — ${e.nombre}`;
                selector.appendChild(opt);

                const targetUrl = `${baseUrl}?ficha=${e.num}`;
                const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(targetUrl)}`;

                const card = document.createElement('div');
                card.className = 'ficha-page';
                card.id = `ficha-${e.num}`;

                card.innerHTML = `
                    <div class="ficha-header">
                        <div>
                            <span class="pilar-tag" contenteditable="true">PUERTA #${e.num} · PILAR: ${e.pilar}</span>
                            <h2 class="ficha-title" contenteditable="true">${e.nombre}</h2>
                            <div class="id-meta" contenteditable="true">
                                <span><strong>Municipio:</strong> ${e.municipio}</span>
                                <span><strong>Dirección:</strong> ${e.direccion}</span>
                                <span><strong>Coordenadas:</strong> ${e.coordenadas}</span>
                                <span><strong>Titularidad:</strong> ${e.titularidad}</span>
                            </div>
                        </div>
                        <a class="qr-box" id="qr-link-${e.num}" href="?ficha=${e.num}" title="Haz clic o escanea para abrir solo la Ficha #${e.num}">
                            <img id="qr-img-${e.num}" src="${qrUrl}" alt="QR Puerta ${e.num}">
                            <span>QR Ficha #${e.num}</span>
                        </a>
                    </div>

                    <div class="hero-grid">
                        <div class="foto-container">
                            <img src="${e.img}" alt="${e.nombre}">
                            <label class="btn-upload">
                                📷 Subir foto desde tu PC
                                <input type="file" accept="image/*" style="display:none" onchange="cambiarImagen(this)">
                            </label>
                        </div>
                        <div class="autoria-panel">
                            <div>
                                <div class="block-label">📐 BLOQUE: AUTORÍA Y FECHAS</div>
                                <div class="data-list">
                                    <div class="data-item full" contenteditable="true">
                                        <small>Arquitecto/a o Constructor</small>
                                        <div>${e.arquitecto}</div>
                                    </div>
                                    <div class="data-item" contenteditable="true">
                                        <small>Año de Proyecto y de Obra</small>
                                        <div>${e.fechas}</div>
                                    </div>
                                    <div class="data-item" contenteditable="true">
                                        <small>Reformas Posteriores</small>
                                        <div>${e.reformas}</div>
                                    </div>
                                    <div class="data-item full" contenteditable="true">
                                        <small>Documentación Gráfica Asociada</small>
                                        <div>${e.docGrafica}</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="nivel-divulgativo">
                        <span class="nivel-badge">NIVEL 1 · LECTURA DIVULGATIVA (RESIDENTES Y FAMILIAS)</span>
                        <div class="divulgativa-box" contenteditable="true">
                            <p><strong>• Por qué importa:</strong> ${e.importa}</p>
                            <p><strong>• Qué mirar al entrar:</strong> ${e.mirar}</p>
                            <p><strong>• Una curiosidad:</strong> ${e.curiosidad}</p>
                        </div>

                        <div class="logistica-grid">
                            <div class="log-card" contenteditable="true">
                                <h4>🕒 Visita</h4>
                                <div>${e.visita}</div>
                            </div>
                            <div class="log-card" contenteditable="true">
                                <h4>♿ Accesibilidad</h4>
                                <div>${e.accesibilidad}</div>
                            </div>
                            <div class="log-card" contenteditable="true">
                                <h4>📋 Normas del Espacio</h4>
                                <div>${e.normas}</div>
                            </div>
                            <div class="log-card" contenteditable="true">
                                <h4>🚌 Cómo Llegar y Rutas</h4>
                                <div>${e.comoLlegar}</div>
                            </div>
                        </div>
                    </div>

                    <div class="nivel-tecnico">
                        <details>
                            <summary>
                                <span>🔍 NIVEL 2 · DETALLE TÉCNICO Y CONSTRUCTIVO (DESPLEGABLE PARA PROFESIONALES)</span>
                                <span class="summary-tag">PULSAR PARA DESPLEGAR</span>
                            </summary>
                            <div class="tecnico-body">
                                <div class="tec-box" contenteditable="true">
                                    <strong>Superficie Construida / Ámbito</strong>
                                    ${e.superficie}
                                </div>
                                <div class="tec-box" contenteditable="true">
                                    <strong>Orientación Solar y Dominante</strong>
                                    ${e.orientacion}
                                </div>
                                <div class="tec-box full" contenteditable="true">
                                    <strong>Sistema Constructivo y Estructural</strong>
                                    ${e.sistema}
                                </div>
                                <div class="tec-box full" contenteditable="true">
                                    <strong>Materiales Empleados (Cal, Sabina, Piedra seca, Marès, Posidonia...)</strong>
                                    ${e.materiales}
                                </div>
                                <div class="tec-box" contenteditable="true">
                                    <strong>Estrategias Bioclimáticas y Eficiencia</strong>
                                    ${e.bioclimatica}
                                </div>
                                <div class="tec-box" contenteditable="true">
                                    <strong>Catalogación Patrimonial y Premios</strong>
                                    ${e.catalogacion}
                                </div>
                            </div>
                        </details>
                    </div>

                    <div class="ficha-footer">
                        <div class="relacionado-bar" contenteditable="true">
                            <strong>🔗 Relacionado:</strong> ${e.relacionado}
                        </div>
                        <div class="prod-control" contenteditable="true">
                            <span><strong>Formato triple:</strong> Web QR · PDF 1 pág. Profesionales · Folleto "48h para redescubrir Ibiza"</span>
                            <span><strong>Control de producción:</strong> Última revisión: 28/10/2026 | Redacción: Equipo Editorial Alumnado | Validado: Dirección OHI</span>
                        </div>
                    </div>
                `;

                container.appendChild(card);
            });

            comprobarParametroQR();
        }

        function actualizarQRs() {
            const baseUrl = obtenerBaseUrl();
            espacios30.forEach((e) => {
                const targetUrl = `${baseUrl}?ficha=${e.num}`;
                const qrImg = document.getElementById(`qr-img-${e.num}`);
                const qrLink = document.getElementById(`qr-link-${e.num}`);
                if (qrImg) {
                    qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(targetUrl)}`;
                }
                if (qrLink) {
                    qrLink.href = targetUrl;
                }
            });
        }

        function comprobarParametroQR() {
            const params = new URLSearchParams(window.location.search);
            const fichaParam = params.get('ficha');
            if (fichaParam) {
                filtrarPorNumero(fichaParam);
            }
        }

        function seleccionarDesdeMenu() {
            const val = document.getElementById('selectorFicha').value;
            if (val === 'all') {
                mostrarTodas();
            } else {
                filtrarPorNumero(val);
            }
        }

        function filtrarPorNumero(num) {
            const fichas = document.querySelectorAll('.ficha-page');
            fichas.forEach(f => {
                f.style.display = (f.id === `ficha-${num}`) ? 'block' : 'none';
            });
            document.getElementById('selectorFicha').value = num;
            document.getElementById('bannerQR').style.display = 'flex';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function mostrarTodas() {
            document.querySelectorAll('.ficha-page').forEach(f => f.style.display = 'block');
            document.getElementById('selectorFicha').value = 'all';
            document.getElementById('bannerQR').style.display = 'none';
            if (window.history.pushState) {
                const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
                window.history.pushState({ path: cleanUrl }, '', cleanUrl);
            }
        }

        function cambiarImagen(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(ev) {
                    const img = input.closest('.foto-container').querySelector('img');
                    img.src = ev.target.result;
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function toggleDetalles(abrir) {
            document.querySelectorAll('.nivel-tecnico details').forEach(d => d.open = abrir);
        }

        renderCatalogo();
    </script>
</body>
